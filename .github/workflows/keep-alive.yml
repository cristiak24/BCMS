name: Keep Render server warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping bcms-server
        # A sleeping Render instance needs ~30-60 s to wake, so a short
        # timeout fails exactly when the ping matters most.
        run: curl -fsS --max-time 120 --retry 2 --retry-delay 5 --retry-all-errors https://bcms-qflv.onrender.com/
