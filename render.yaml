services:
  - type: web
    name: bcms-server
    runtime: node
    rootDir: apps/server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false        # ← setezi manual în Render Dashboard
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Orele din DB (`timestamp` fără fus) sunt UTC; procesul rulează explicit
      # în UTC, ca plasă de siguranță pentru orice `new Date()` rămas (audit P1-15).
      - key: TZ
        value: UTC
