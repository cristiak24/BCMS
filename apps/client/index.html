<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="application-name" content="BCMS" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BCMS" />
    <meta name="description" content="Administrarea clubului de baschet: program, prezență, plăți și echipe." />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#F4F5F8" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
    <!-- iOS ignores SVG touch icons (the home-screen tile became a page screenshot). -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>BCMS</title>
    <script>
      // Apply the saved theme before first paint to avoid a light→dark flash.
      (function () {
        try {
          var stored = localStorage.getItem('bcms.theme');
          // Must match ThemeContext's default ('system'), or first-time
          // visitors on a dark OS get a light frame, then a flip to dark.
          var mode = stored === 'dark' || stored === 'light' || stored === 'system' ? stored : 'system';
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0A0B11' : '#F4F5F8');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
